name: Market
version: "${project.version}"
main: net.craftnepal.market.Market
api-version: "1.21"
depend: [Vault]
softdepend: [WorldEdit]

permissions:
  # === ADMIN ===
  market.admin:
    description: All admin commands, admin shops and seeing plot internals
    default: op

  # === PLAYERS (everyone by default; negate in your permissions plugin to restrict) ===
  market.use:
    description: Teleport to the market with /market
    default: true
  market.shops:
    description: Browse the market shops GUI
    default: true
  market.back:
    description: Return to your previous location with /market leave
    default: true
  market.plot.claim:
    description: Claim a market plot
    default: true
  market.plot.unclaim:
    description: Unclaim your market plot
    default: true
  market.plot.info:
    description: View plot info
    default: true
  market.plot.teleport:
    description: Teleport to your own plot
    default: true
  market.plot.setspawn:
    description: Set your plot spawn
    default: true
  market.plot.addmember:
    description: Add a trusted member to your plot
    default: true
  market.plot.removemember:
    description: Remove a member from your plot
    default: true

  # === PLOT LIMITS ===
  # market.plots.limit.<n> (1-100) raises a player's plot limit to n; the highest one wins.
  # Without any, market-world.max-plots-per-player applies.
  market.plots.limit.unlimited:
    description: No limit on the number of plots
    default: false
